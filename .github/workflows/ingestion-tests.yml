name: Document ingestion tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ingestion-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ingestion-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Parser tests never connect to the DB or Storage.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-only-not-a-real-key
      JWT_SECRET: test-only-not-a-real-secret
      REQUIRE_INGESTION_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install OCR engine and language data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parsers, upload routing, and real OCR
        run: python -m pytest tests/ -q
